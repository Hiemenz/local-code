[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localcode"
version = "0.1.0"
description = "A Claude Code-compatible coding assistant that runs entirely on local LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "localcode contributors" }]
keywords = ["llm", "coding-assistant", "ollama", "local-ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "prompt-toolkit>=3.0.47",
    "pathspec>=0.12",
]

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.4",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
localcode = "localcode.cli.app:main"
lc = "localcode.cli.app:main"

[project.urls]
Documentation = "https://github.com/localcode/localcode/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["localcode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true

# Tool.run subclasses narrow **kwargs to typed keyword parameters on purpose:
# arguments are validated against each tool's JSON schema before dispatch.
[[tool.mypy.overrides]]
module = "localcode.tools.*"
disable_error_code = ["override"]

# FastAPI's decorators are untyped from mypy strict's point of view.
[[tool.mypy.overrides]]
module = "localcode.api.*"
disable_error_code = ["untyped-decorator", "misc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["localcode"]
omit = ["localcode/api/*", "localcode/cli/app.py"]
